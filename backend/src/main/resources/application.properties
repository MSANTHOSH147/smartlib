spring.application.name=smartlib-backend

# Server
server.port=${PORT:10000}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartlib?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:smartlib-development-jwt-secret-key-min-256-bits-for-local-testing-only-replace-in-prod}
jwt.expiration=86400000

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}

# ============================================================
# GEMINI AI CONFIGURATION (Phase 1)
# Environment variables:
#   GEMINI_API_KEY=
#   GEMINI_MODEL=gemini-3.8-flash
#   GEMINI_EMBEDDING_MODEL=gemini-embedding-2
#   GEMINI_EMBEDDING_DIMENSION=768
#   GEMINI_TIMEOUT_SECONDS=30
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
gemini.embedding.dimension=${GEMINI_EMBEDDING_DIMENSION:768}
gemini.timeout.seconds=${GEMINI_TIMEOUT_SECONDS:30}
gemini.enabled=${GEMINI_ENABLED:true}

# ============================================================
# GROQ AI CONFIGURATION (Phase 6.5 - Fallback Provider)
# Environment variables:
#   GROQ_API_KEY=
#   GROQ_BASE_URL=https://api.groq.com/openai/v1
#   GROQ_MODEL=llama-3.3-70b-versatile
#   GROQ_ENABLED=true
#   GROQ_TIMEOUT=30
# ============================================================
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.enabled=${GROQ_ENABLED:true}
groq.timeout=${GROQ_TIMEOUT:30}

# ============================================================
# AI MODEL ROUTER CONFIGURATION (Phase 6.5)
# Environment variables:
#   AI_PRIMARY_PROVIDER=gemini
#   AI_FALLBACK_PROVIDER=groq
# ============================================================
ai.primary-provider=${AI_PRIMARY_PROVIDER:gemini}
ai.fallback-provider=${AI_FALLBACK_PROVIDER:groq}
ai.routing.cooldown-seconds=${AI_ROUTING_COOLDOWN_SECONDS:60}

# ============================================================
# AI WEB GROUNDING CONFIGURATION (Phase 8)
# Environment variables:
#   AI_WEB_GROUNDING_ENABLED=true
#   AI_WEB_GROUNDING_MAX_RESULTS=5
# ============================================================
ai.web-grounding.enabled=${AI_WEB_GROUNDING_ENABLED:true}
ai.web-grounding.max-results=${AI_WEB_GROUNDING_MAX_RESULTS:5}

# ============================================================
# QDRANT VECTOR DATABASE CONFIGURATION (Phase 1)
# Environment variables:
#   QDRANT_URL=http://localhost:6333
#   QDRANT_HOST=http://localhost:6333
#   QDRANT_API_KEY=
#   QDRANT_COLLECTION=smartlib_books
# ============================================================
qdrant.host=${QDRANT_URL:${QDRANT_HOST:http://localhost:6333}}
qdrant.api.key=${QDRANT_API_KEY:}
qdrant.collection.name=${QDRANT_COLLECTION:smartlib_books}

# ============================================================
# SMARTLIB AI MEMORY PROPERTIES (Phase 9)
# Environment variables:
#   AI_MEMORY_ENABLED=true
#   AI_MEMORY_MIN_CONFIDENCE=0.75
#   AI_MEMORY_MAX_CONTEXT_MEMORIES=10
# ============================================================
ai.memory.enabled=${AI_MEMORY_ENABLED:true}
ai.memory.min-confidence=${AI_MEMORY_MIN_CONFIDENCE:0.75}
ai.memory.max-context-memories=${AI_MEMORY_MAX_CONTEXT_MEMORIES:10}

# ============================================================
# AI RATE LIMITING (Phase 7 & 14)
# Environment variables:
#   AI_RATE_LIMIT_PER_MINUTE=10
# ============================================================
ai.rate-limit.per-minute=${AI_RATE_LIMIT_PER_MINUTE:10}

# ============================================================
# AI RERANKING CONFIGURATION (Phase 11 & 14)
# Environment variables:
#   AI_RERANKING_ENABLED=true
#   AI_RERANKING_CANDIDATE_LIMIT=20
#   AI_RERANKING_FINAL_LIMIT=5
# ============================================================
ai.reranking.enabled=${AI_RERANKING_ENABLED:true}
ai.reranking.candidate-limit=${AI_RERANKING_CANDIDATE_LIMIT:20}
ai.reranking.final-limit=${AI_RERANKING_FINAL_LIMIT:5}

# ============================================================
# ACTUATOR / OBSERVABILITY SECURITY (Phase 13 & 14)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false